name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 0

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "adopt"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Access Secrets & Create Properties
        working-directory: "src"
        env:
          SIMKL_API: ${{ secrets.SIMKL_API }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CASTLE_KEY: ${{ secrets.CASTLE_KEY }}
          MOVIEBLAST_TOKEN: ${{ secrets.MOVIEBLAST_TOKEN }}
          MOVIEBLAST_API: ${{ secrets.MOVIEBLAST_API }}
          MOVIEBLAST_KEY: ${{ secrets.MOVIEBLAST_KEY }}
        run: |
          touch local.properties
          echo "SIMKL_API=$SIMKL_API" >> local.properties
          echo "TMDB_KEY=$TMDB_KEY" >> local.properties
          echo "CASTLE_KEY=$CASTLE_KEY" >> local.properties
          echo "MOVIEBLAST_TOKEN=$MOVIEBLAST_TOKEN" >> local.properties
          echo "MOVIEBLAST_API=$MOVIEBLAST_API" >> local.properties
          echo "MOVIEBLAST_KEY=$MOVIEBLAST_KEY" >> local.properties

      - name: Build Plugins
        working-directory: "src"
        run: |
          echo "=== listing files in src folder ==="
          ls -la
          
          if [ -f "gradlew" ]; then
            echo "gradlew found, setting execution permissions..."
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          else
            echo "gradlew NOT found! Falling back to system gradle..."
            GRADLE_CMD="gradle"
          fi
          
          git_modules=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git_modules=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep -v '^\.' | cut -d'/' -f1 | sort -u) || git_modules=""
          fi
          
          build_commands=""
          for module in $git_modules; do
            if [ -d "$module" ] && [ "$module" != "builds" ] && [ "$module" != "src" ]; then
              build_commands="$build_commands :$module:make"
            fi
          done
          
          if [ -n "$build_commands" ]; then
            echo "Building modified modules: $build_commands"
            $GRADLE_CMD $build_commands makePluginsJson
          else
            echo "No specific modified modules detected (or manual run). Building all modules..."
            $GRADLE_CMD make makePluginsJson
          fi

          find . -type f -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \; || echo "No .cs3 files found"
          find . -type f -name "plugins.json" -exec cp {} $GITHUB_WORKSPACE/builds/ \; || echo "No plugins.json found"

      - name: Push builds
        working-directory: "builds"
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if [[ -n $(git status -s) ]]; then
            git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA"
            git push --force
          else
            echo "No changes to push"
          fi
