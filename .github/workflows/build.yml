name: Build

#Concurrency scoped to the specific branch/ref, not global
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  #Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

#Grant permission to push changes back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6.0.2
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v6.0.2
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "adopt"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Update build.gradle.kts from test.txt
        working-directory: "src"
        shell: python
        run: |
          import json
          import os
          import urllib.request

          # رابط ملف البيانات الخاص بك
          url = "https://raw.githubusercontent.com/abod1232/Testa/refs/heads/master/test.txt"

          try:
              response = urllib.request.urlopen(url)
              data = json.loads(response.read().decode('utf-8'))
          except Exception as e:
              print(f"Error fetching JSON: {e}")
              exit(1)

          # جلب جميع مجلدات الإضافات الفرعية الحالية
          dirs = [d for d in os.listdir('.') if os.path.isdir(d) and not d.startswith('.')]

          # دالة لتنظيف الاسم للمطابقة الذكية وتجنب مشاكل المسافات والرموز
          def clean_name(name):
              return name.lower().replace(' ', '').replace('-', '').replace('_', '').replace('(', '').replace(')', '')

          dir_map = {clean_name(d): d for d in dirs}

          for item in data:
              internal_name = item.get("internalName", "")
              name = item.get("name", "")
              
              target_dir = None
              cleaned_internal = clean_name(internal_name)
              cleaned_name = clean_name(name)
              
              # محاولة مطابقة الاسم مع مجلد في المشروع
              if cleaned_internal in dir_map:
                  target_dir = dir_map[cleaned_internal]
              elif cleaned_name in dir_map:
                  target_dir = dir_map[cleaned_name]
                  
              if target_dir:
                  gradle_path = os.path.join(target_dir, "build.gradle.kts")
                  print(f"Updating: {gradle_path} for {internal_name}...")
                  
                  # جلب المتغيرات المطلوبة فقط وتجاهل fileSize وروابط التحميل الأخرى
                  version = item.get("version", 1)
                  description = item.get("description", "")
                  authors = item.get("authors", ["Abodabodd"])
                  status = item.get("status", 1)
                  tv_types = item.get("tvTypes", [])
                  icon_url = item.get("iconUrl", "")
                  
                  # تحويل مصفوفات الأبحاث والأنواع لتناسب كود Kotlin
                  authors_kotlin = ", ".join([f'"{a}"' for a in authors])
                  tv_types_kotlin = ",\n        ".join([f'"{t}"' for t in tv_types])
                  
                  # توليد محتوى ملف build.gradle.kts الجديد بالكامل
                  content = f"""version = {version}

          cloudstream {{
              description = "{description}"
              authors = listOf({authors_kotlin})

              status = {status}

              tvTypes = listOf(
                  {tv_types_kotlin}
              )

              iconUrl = "{icon_url}"
          }}
          """
                  with open(gradle_path, "w", encoding="utf-8") as f:
                      f.write(content)
              else:
                  print(f"No matching directory found for: {internal_name} / {name}")

      - name: Access Secrets & Create Properties
        env:
          SIMKL_API: ${{ secrets.SIMKL_API }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CASTLE_KEY: ${{ secrets.CASTLE_KEY }}
          MOVIEBLAST_TOKEN: ${{ secrets.MOVIEBLAST_TOKEN }}
          MOVIEBLAST_API: ${{ secrets.MOVIEBLAST_API }}
          MOVIEBLAST_KEY: ${{ secrets.MOVIEBLAST_KEY }}

        run: |
          cd $GITHUB_WORKSPACE/src
          # Create file if it doesn't exist
          touch local.properties
          echo "SIMKL_API=$SIMKL_API" >> local.properties
          echo "TMDB_KEY=$TMDB_KEY" >> local.properties
          echo "CASTLE_KEY=$CASTLE_KEY" >> local.properties
          echo "MOVIEBLAST_TOKEN=$MOVIEBLAST_TOKEN" >> local.properties
          echo "MOVIEBLAST_API=$MOVIEBLAST_API" >> local.properties
          echo "MOVIEBLAST_KEY=$MOVIEBLAST_KEY" >> local.properties

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson

          # Copy files (fail safely if directory doesn't exist)
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds/ || echo "No .cs3 files found"
          cp build/plugins.json $GITHUB_WORKSPACE/builds/ || echo "No plugins.json found"

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .

          # Only commit/push if there are changes
          if [[ -n $(git status -s) ]]; then
            git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA"
            git push --force
          else
            echo "No changes to push"
          fi
